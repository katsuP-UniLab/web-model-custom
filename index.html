<!DOCTYPE html>
<html lang="en" data-theme="macchiato">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOLO Web Object Detection</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script defer src="script.js"></script>
  <style>
    :root, [data-theme="macchiato"] {
      --ctp-base: #24273a;
      --ctp-mantle: #1e2030;
      --ctp-crust: #181926;
      --ctp-surface0: #363a4f;
      --ctp-surface1: #494d64;
      --ctp-surface2: #5b6078;
      --ctp-overlay0: #6e738d;
      --ctp-overlay1: #8087a2;
      --ctp-text: #cad3f5;
      --ctp-subtext0: #a5adcb;
      --ctp-subtext1: #b8c0e0;
      --ctp-blue: #8aadf4;
      --ctp-blue-hover: #7b9fe8;
      --ctp-green: #a6da95;
      --ctp-yellow: #eed49f;
      --ctp-peach: #f5a97f;
      --ctp-red: #ed8796;
      --ctp-mauve: #c6a0f6;
      --btn-text: #181926;
      --card-bg: var(--ctp-mantle);
      --card-border: var(--ctp-surface0);
      --input-bg: var(--ctp-surface0);
      --input-border: var(--ctp-surface1);
      --canvas-bg: var(--ctp-crust);
    }

    [data-theme="latte"] {
      --ctp-base: #eff1f5;
      --ctp-mantle: #e6e9ef;
      --ctp-crust: #dce0e8;
      --ctp-surface0: #ccd0da;
      --ctp-surface1: #bcc0cc;
      --ctp-surface2: #acb0be;
      --ctp-overlay0: #9ca0b0;
      --ctp-overlay1: #8c8fa1;
      --ctp-text: #4c4f69;
      --ctp-subtext0: #6c6f85;
      --ctp-subtext1: #5c5f77;
      --ctp-blue: #1e66f5;
      --ctp-blue-hover: #185adb;
      --ctp-green: #40a02b;
      --ctp-yellow: #df8e1d;
      --ctp-peach: #fe640b;
      --ctp-red: #d20f39;
      --ctp-mauve: #8839ef;
      --btn-text: #ffffff;
      --card-bg: var(--ctp-mantle);
      --card-border: var(--ctp-surface0);
      --input-bg: #ffffff;
      --input-border: var(--ctp-surface1);
      --canvas-bg: #111116;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: var(--ctp-base);
      color: var(--ctp-text);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--ctp-mauve);
    }

    .theme-switcher {
      display: inline-flex;
      align-items: center;
      background-color: var(--ctp-surface0);
      border: 1px solid var(--ctp-surface1);
      border-radius: 9999px;
      padding: 3px;
      gap: 3px;
    }

    .theme-option {
      background: transparent;
      border: none;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ctp-subtext0);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .theme-option:hover {
      color: var(--ctp-text);
      background: var(--ctp-surface1);
    }

    .theme-option.active {
      background-color: var(--ctp-blue);
      color: var(--btn-text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .config-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .config-card h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 12px;
      color: var(--ctp-blue);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--ctp-subtext1);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], textarea {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--input-border);
      background-color: var(--input-bg);
      color: var(--ctp-text);
      border-radius: 6px;
      font-size: 14px;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--ctp-blue);
    }

    input[type="file"] {
      color: var(--ctp-subtext0);
      font-size: 13px;
    }

    textarea {
      width: 100%;
      height: 90px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      resize: vertical;
    }

    button {
      padding: 8px 16px;
      background-color: var(--ctp-blue);
      color: var(--btn-text);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--ctp-blue-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--ctp-subtext0);
    }
    .status-badge.success { color: var(--ctp-green); font-weight: 600; }
    .status-badge.error { color: var(--ctp-red); font-weight: 600; }
    .status-badge.loading { color: var(--ctp-peach); font-weight: 600; }

    .preview-section {
      text-align: center;
      margin-top: 20px;
    }

    canvas {
      border: 1px solid var(--card-border);
      border-radius: 8px;
      max-width: 100%;
      height: auto;
      background-color: var(--canvas-bg);
      margin-top: 10px;
    }

    .file-input-wrapper {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="top-header">
    <h1>🐶 YOLO Web Object Detection</h1>
    <div class="theme-switcher" role="group" aria-label="Color theme switcher">
      <button type="button" class="theme-option active" data-theme-target="macchiato" id="themeMacchiatoBtn">
        🌙 Macchiato
      </button>
      <button type="button" class="theme-option" data-theme-target="latte" id="themeLatteBtn">
        ☀️ Latte
      </button>
    </div>
  </div>

  <!-- Model Configuration -->
  <div class="config-card">
    <h2>1. Model Configuration</h2>
    <div class="form-group">
      <label for="modelUrl">Load from URL / Path:</label>
      <div class="input-row">
        <input type="text" id="modelUrl" placeholder="e.g. best.onnx or https://example.com/best.onnx" value="best.onnx" />
        <button id="loadModelBtn" type="button">Load Model</button>
      </div>
    </div>
    <div class="form-group">
      <label for="modelFileInput">Or upload .onnx file directly:</label>
      <input type="file" id="modelFileInput" accept=".onnx" />
    </div>
    <div id="modelStatus" class="status-badge">Model not loaded</div>
  </div>

  <!-- Label Configuration -->
  <div class="config-card">
    <h2>2. Labels Configuration</h2>
    <div class="form-group">
      <label for="labelUrl">Option A: Fetch Labels from URL (JSON):</label>
      <div class="input-row">
        <input type="text" id="labelUrl" placeholder="e.g. labels.json or https://example.com/labels.json" value="labels.json" />
        <button id="fetchLabelsBtn" type="button">Fetch URL</button>
      </div>
    </div>
    <div class="form-group">
      <label for="labelFileInput">Option B: Upload Labels file (.json / .txt):</label>
      <input type="file" id="labelFileInput" accept=".json,.txt" />
    </div>
    <div class="form-group">
      <label for="labelsTextarea">Option C: Edit / Paste Labels (JSON array or text):</label>
      <textarea id="labelsTextarea" placeholder='["french bulldog", "german shepherd", "golden retriever"]'></textarea>
      <div style="margin-top: 6px;">
        <button id="applyLabelsBtn" type="button">Apply Textarea Labels</button>
      </div>
      <div id="labelStatus" class="status-badge">Labels not loaded</div>
    </div>
  </div>

  <!-- Inference Section -->
  <div class="config-card preview-section">
    <h2>3. Run Detection</h2>
    <div class="file-input-wrapper">
      <input type="file" id="imageInput" accept="image/*" />
    </div>
    <div id="inferenceStatus" class="status-badge"></div>
    <div>
      <canvas id="canvas" width="640" height="640"></canvas>
    </div>
  </div>
</body>
</html>
